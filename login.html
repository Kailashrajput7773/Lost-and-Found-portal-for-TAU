<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – The Apollo University</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="brand">
        <img class="logo-img" src="apollo-logo.svg" alt="The Apollo University logo">
        <div class="brand-title">The Apollo University – Lost & Found Portal</div>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="report-lost.html">Report Lost</a>
        <a class="nav-link" href="report-found.html">Report Found</a>
        <a class="nav-link" href="listings.html">Lost Items</a>
        <a class="nav-link" href="admin.html">Admin</a>
        <button id="theme_toggle" class="theme-toggle" title="Toggle Light/Dark Mode">🌙</button>
      </div>
    </div>
  </header>
  
  <main class="login-main">
    <div class="login-wrapper">
      <div class="form login-card">
        <h1 class="form-title" style="text-align: center;">Welcome Back</h1>
        <p class="hero-desc" style="text-align: center; margin-bottom: 24px;">Login to The Apollo Community Portal</p>
        
        <div class="login-tabs">
          <button id="tab_user" class="login-tab active">Student / Staff</button>
          <button id="tab_admin" class="login-tab">Administrator</button>
        </div>
        
        <!-- User Login Form -->
        <div id="form_user" class="login-form-view active">
          <div class="field">
            <label class="label">University Email</label>
            <input class="input" type="email" id="login_email" placeholder="e.g. name@apollo.edu.in">
          </div>
          <button id="submit_user" class="btn" style="width: 100%; margin-top: 10px;">Login as Student</button>
        </div>

        <!-- Admin Login Form -->
        <div id="form_admin" class="login-form-view" style="display: none;">
          <div class="field">
            <label class="label">Admin Verification Key</label>
            <input class="input" type="password" id="login_admin_key" placeholder="Enter admin key">
          </div>
          <button id="submit_admin" class="btn secondary" style="width: 100%; margin-top: 10px;">Login as Admin</button>
        </div>

      </div>
    </div>
  </main>
  
  <div id="toast" class="toast"></div>
  <script src="client.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initTheme(); // Ensure theme applies
      
      const tabUser = document.getElementById("tab_user");
      const tabAdmin = document.getElementById("tab_admin");
      const formUser = document.getElementById("form_user");
      const formAdmin = document.getElementById("form_admin");
      
      tabUser.addEventListener("click", () => {
        tabUser.classList.add("active");
        tabAdmin.classList.remove("active");
        formUser.style.display = "block";
        formAdmin.style.display = "none";
      });
      
      tabAdmin.addEventListener("click", () => {
        tabAdmin.classList.add("active");
        tabUser.classList.remove("active");
        formAdmin.style.display = "block";
        formUser.style.display = "none";
      });

      document.getElementById("submit_user").addEventListener("click", () => {
        const email = document.getElementById("login_email").value.trim();
        if (!email) {
          showToast("Please enter an email");
          return;
        }
        if (!isApolloEmail(email)) {
          showToast("Use your Apollo University email");
          return;
        }
        // Save session
        const session = { email, type: 'user' };
        localStorage.setItem("apollo_session", JSON.stringify(session));
        showToast("Logged in successfully!");
        setTimeout(() => { window.location.href = "index.html"; }, 1000);
      });

      document.getElementById("submit_admin").addEventListener("click", () => {
        const key = document.getElementById("login_admin_key").value.trim();
        if (!key) {
          showToast("Please enter the admin key");
          return;
        }
        // Save admin session
        const session = { email: 'Admin', type: 'admin', adminKey: key };
        localStorage.setItem("apollo_session", JSON.stringify(session));
        showToast("Admin access granted!");
        setTimeout(() => { window.location.href = "admin.html"; }, 1000);
      });
    });
  </script>
</body>
</html>
